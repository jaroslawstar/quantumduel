# Ustawienia projektu Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX zamiast starych bibliotek wsparcia.
android.useAndroidX=true
# Styl kodu Kotlin: "official" lub "obsolete".
kotlin.code.style=official
# Każda klasa R zawiera tylko zasoby swojego modułu.
android.nonTransitiveRClass=true
